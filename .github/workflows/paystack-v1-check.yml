name: Paystack V1 Checks

on:
  push:
    branches:
      - feat/paystack-v1
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/paystack-links/index.ts
      - run: deno check supabase/functions/paystack-payment-link/index.ts
      - run: deno check supabase/functions/paystack-initialize/index.ts
      - run: deno check supabase/functions/paystack-webhook/index.ts
